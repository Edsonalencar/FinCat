<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guias grátis @corosivo</title>
<meta name="description" content="Guias rápidos para não cair em golpe e cuidar do teu dinheiro.">
<meta property="og:type" content="website">
<meta property="og:title" content="Guias grátis @corosivo">
<meta property="og:description" content="Guias rápidos para não cair em golpe e cuidar do teu dinheiro.">
<meta property="og:url" content="https://www.fincat.com.br/guias/">
<meta property="og:image" content="https://www.fincat.com.br/guias/leilao/capa.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--noite:#0d1430;--noite2:#1b2550;--fg:#eef1fb;--suave:#a7afd0;--ouro:#ffc21a;--amarelo:#ffd21f;--preto:#141414;--destaque:#F58A1F;--titulo:'Lilita One','Arial Black',sans-serif;--texto:'Montserrat','Segoe UI',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--noite2) 0%,var(--noite) 60%) fixed,var(--noite);color:var(--fg);font-family:var(--texto);font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
main{max-width:1040px;margin:0 auto;padding:40px max(18px,env(safe-area-inset-right)) 56px max(18px,env(safe-area-inset-left))}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:34px;flex-wrap:wrap}
.autor{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800}
.autor img{width:40px;height:40px;border-radius:50%;border:3px solid var(--destaque)}
.selo{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--preto);border:3px solid var(--destaque);border-radius:999px;padding:5px 14px 5px 10px;font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.selo i{width:10px;height:10px;border-radius:50%;background:var(--destaque)}
.heroi{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:48px;align-items:center}
.capa{display:block;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--destaque),0 24px 50px rgba(0,0,0,.55);transform:rotate(-2deg)}
.capa img{display:block;width:100%;height:auto}
h1{margin:14px 0 10px;font-family:var(--titulo);font-weight:400;font-size:clamp(44px,7vw,76px);line-height:.98;text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(180deg,#fff3a6 0%,var(--ouro) 45%,#e08a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #5a2e00;paint-order:stroke fill;filter:drop-shadow(0 3px 0 #6b3900) drop-shadow(0 10px 14px rgba(0,0,0,.45));text-wrap:balance}
.sub{font-size:19px;font-weight:700;margin:0 0 24px;max-width:34ch}
.botoes{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:16px;border:3px solid var(--preto);font-weight:900;font-size:17px;text-decoration:none;text-transform:uppercase;letter-spacing:.3px;box-shadow:0 6px 0 var(--preto);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--preto)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.ler{background:var(--amarelo);color:var(--preto)}
.baixar{background:#fff;color:var(--preto)}
.ficha{margin:14px 0 0;color:var(--suave);font-size:13px;font-weight:700}
.secao{margin-top:64px}
.secao h2{font-family:var(--titulo);font-weight:400;font-size:28px;text-transform:uppercase;margin:0 0 16px;letter-spacing:.4px}
.caps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.caps li{display:flex;gap:12px;align-items:center;background:#fff;color:var(--preto);border:3px solid var(--preto);border-radius:14px;padding:10px 14px 10px 10px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.4);line-height:1.25}
.caps .n{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:3px solid var(--preto);background:var(--destaque);font-family:var(--titulo);font-size:18px}
.parceiro{display:flex;gap:18px;align-items:center;background:#fff;color:var(--preto);border-radius:20px;border:3px solid #ffce2d;padding:20px 22px;text-decoration:none;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.parceiro .logo{flex:none;width:64px;height:64px;border-radius:16px;background:#ffce2d;display:grid;place-items:center}
.parceiro .logo svg{width:36px;height:36px}
.parceiro small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#6b7080}
.parceiro b{display:block;font-size:20px;font-weight:900;line-height:1.2;margin:2px 0}
.parceiro span{display:block;font-size:15px;color:#3b3f46}
.parceiro em{display:block;font-style:normal;font-weight:800;margin-top:6px}
footer{margin-top:56px;color:var(--suave);font-size:13px;font-weight:600;text-align:center}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:24px;list-style:none;margin:0;padding:0}
.grade a{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.grade img{width:100%;height:auto;border-radius:10px;box-shadow:0 0 0 3px #fff,0 14px 30px rgba(0,0,0,.5)}
.grade b{font-weight:900;font-size:17px;line-height:1.25}
@media (max-width:760px){main{padding-top:24px}.heroi{grid-template-columns:1fr;gap:34px;justify-items:center;text-align:center}.capa{max-width:300px}.sub{margin-inline:auto}.botoes{justify-content:center}.parceiro{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
	<div class="topo"><span class="autor"><img src="leilao/perfil.jpg" alt="" width="40" height="40">@corosivo</span><span class="selo"><i></i>Guias grátis</span></div>
	<h1 style="margin-bottom:28px">Guias grátis</h1>
	<ul class="grade"><li><a href="leilao/"><img src="leilao/capa.jpg" alt="" width="794" height="1123" loading="lazy"><b>Leilão fantasma</b></a></li></ul>
	<section class="secao"><a class="parceiro" href="https://www.fincat.com.br"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4c1.5 2 3 3 6 3s4.5-1 6-3c1 2 2 4 2 7 0 4.5-3.5 8-8 8s-8-3.5-8-8c0-3 1-5 2-7z"/><circle cx="9" cy="12" r="1" fill="#1a1200"/><circle cx="15" cy="12" r="1" fill="#1a1200"/></svg></span><span><small>Apoio · FinCat</small><b>Veja o futuro das tuas finanças</b><span>O FinCat projeta como tu vai fechar o mês antes dele acabar, e dá pra lançar gasto direto pelo WhatsApp.</span><em>fincat.com.br →</em></span></a></section>
	<footer>@corosivo</footer>
</main>
</body>
</html>
